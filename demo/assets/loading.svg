<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Loading">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#b789ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="80" cy="80" r="60" fill="url(#glow)">
    <animate attributeName="r" values="50;64;50" dur="2.4s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </circle>

  <circle cx="80" cy="80" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>

  <circle cx="80" cy="80" r="52" fill="none" stroke="url(#ring)" stroke-width="6"
    stroke-linecap="round" stroke-dasharray="82 245">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80"
      dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="80" cy="80" r="17" fill="none" stroke="url(#ring)" stroke-width="3"
    stroke-linecap="round" stroke-dasharray="28 79" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80"
      dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="80" cy="80" r="5" fill="#e6e9ff">
    <animate attributeName="r" values="4;6;4" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.1s" repeatCount="indefinite"/>
  </circle>
</svg>
